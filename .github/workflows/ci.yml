name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements-assets.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install native pixel-art tools
        run: |
          cargo install --git https://github.com/Hugo-Dz/spritefusion-pixel-snapper --rev ae20461f60fb39e75d15f184bab1ebec1219511c --locked
          cargo install fastpack --locked
          cargo install oxipng --locked
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Exercise generated-art normalization with native Pixel Snapper
        run: |
          npm run art:bootstrap-living
          npm run art:snap:strict
          npm run validate:pixel-snap
      - run: npm run assets
      - run: npm run validate:assets
      - run: npm run validate:living
      - run: npm run validate:determinism
      - run: npm run validate:syntax
      - run: npm run test:domain
      - run: npm run validate:scope
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
